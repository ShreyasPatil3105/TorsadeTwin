# Drug registry (§5.3). cmax_free_nM values are PLACEHOLDER until a human transcribes
# them from Li et al. 2019 (doi:10.1002/cpt.1184) and marks them VERIFIED.
# Free C_max values as published in the CiPA training set; cmax_basis: free is mandatory.
drugs:
  - drug_id: dofetilide
    drug_name: Dofetilide
    cmax_free_nM: 2
    cmax_source_doi: "10.1002/cpt.1184"
    cmax_basis: free
    max_validated_multiple: 25
    discontinuable: false
    dose_steps: [1.0, 0.75, 0.5, 0.25]
    cipa_training_risk_label: high
    qt_risk_class_manual: null
    notes: "canonical selective IKr blocker; direction test"
