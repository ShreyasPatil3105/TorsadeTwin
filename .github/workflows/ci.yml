name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: CI gate (unit + api + failure + repro + contract)
        run: pytest tests/unit tests/api tests/failure tests/repro tests/contract -q
      - name: Offline assertion (no outbound sockets)
        run: python scripts/check_offline.py
      - name: Data integrity
        run: python scripts/verify_data_integrity.py
