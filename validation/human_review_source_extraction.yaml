# HUMAN-REVIEW / TRANSCRIPTION WORKSHEET ONLY.
# This file is deliberately not read by the runtime registry.  It is not evidence
# of verification and must not be copied into data/drug_parameters.csv until
# independent human double-entry, source review, and provenance review are done.
worksheet_version: 1
purpose: >-
  Direct-source transcription candidates for the requested CiPA drugs. Values
  preserve the source notation and have no VERIFIED status.
rules:
  extraction_status_required: HUMAN_REVIEW_REQUIRED
  verification_status: NOT_VERIFIED
  runtime_use: PROHIBITED
  source_values_are_not_specification_evidence: true

sources:
  crumb_2016:
    doi: "10.1016/j.vascn.2016.03.009"
    source_url: "https://cipaproject.org/wp-content/uploads/2016/12/Crumb-30-drugs-on-CiPA-ion-channels-J-Pharm-Tox-Sci-2016-proof-ahead-of-print.pdf"
    citation: >-
      Crumb WJ Jr, Vicente J, Johannesen L, Strauss DG. An evaluation of 30
      clinical drugs against the comprehensive in vitro proarrhythmia assay
      (CiPA) proposed ion channel panel. J Pharmacol Toxicol Methods.
      2016;81:251-262. doi:10.1016/j.vascn.2016.03.009.
    exact_location: "Table 2, PDF page 10 (printed journal page 11), present-study values (first value in each pair)."
    scope: >-
      Table 2 reports IC50 comparison values only for hERG, Cav1.2, and
      Nav1.5-peak. It does not report Hill coefficients.

  li_2019:
    doi: "10.1002/cpt.1184"
    source_url: "https://ascpt.onlinelibrary.wiley.com/doi/10.1002/cpt.1184"
    citation: >-
      Li Z, Ridder BJ, Han X, et al. Assessment of an In Silico Mechanistic
      Model for Proarrhythmia Risk Prediction Under the CiPA Initiative.
      Clin Pharmacol Ther. 2019;105(2):466-475. doi:10.1002/cpt.1184.
    validation_report_url: "https://ascpt.onlinelibrary.wiley.com/action/downloadSupplement?doi=10.1002/cpt.1184&file=cpt1184-sup-0002-SupInfoS2.pdf"

