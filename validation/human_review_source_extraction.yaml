# These are evidence-location findings, not values.  They deliberately remain
# outside `records` and cannot be mistaken for a pharmacology transcription.
unresolved_requested_data:
  - dataset: "Crumb 2016 Hill coefficients for all requested channels"
    status: SOURCE_REQUIRED
    finding: "The public main-article Table 2 contains IC50 values only; no Hill coefficients are reported there."
    required_location: "Crumb 2016 supplementary tables/data package for the full CiPA ion-channel panel."
    channels: [IKr, ICaL, INa_peak, INaL, IKs, Ito, IK1]
  - dataset: "Crumb 2016 IC50 values for INaL, IKs, Ito, and IK1"
    status: SOURCE_REQUIRED
    finding: "Not present in main-article Table 2; article text directs readers to supplementary tables for source data."
    required_location: "Crumb 2016 supplementary tables/data package for the full CiPA ion-channel panel."
  - dataset: "Li 2019 free Cmax and CiPA risk labels for dofetilide, sotalol, quinidine, cisapride, verapamil, and diltiazem"
    status: SOURCE_LOCATION_NOT_FOUND_FOR_REQUESTED_TRAINING_DRUGS
    finding: >-
      The main article identifies 12 training and 16 validation compounds, and
      Figure 2 shows training qNet distributions by risk color, but it does not
      provide a tabulated training-drug Cmax/risk-label dataset. The cited
      Validation Report Supplement S2 Table 5 is explicitly for the 16
      validation drugs, not these requested training drugs.
    checked_locations:
      - "Li 2019 main text, especially Results paragraphs associated with Figure 2 (training) and Supplement S2 (validation)."
      - "Li 2019 Supplementary Text S2, Tables 1-2 (training block data) and Table 5 (validation risk levels and Cmax)."
    next_authoritative_source: >-
      Identify the CiPA training-data publication or original clinical-label
      source cited by Li et al.; do not infer labels or Cmax from Figure 2.

human_double_entry_requirements:
  - "A second human independently transcribes each record from the cited table."
  - "A reviewer reconciles both entries, preserves GREATER_THAN qualifiers, and records identity/date."
  - "A pharmacology reviewer confirms channel mapping, units, assay context, and whether censored values are admissible."
  - "Only then may approved values enter the registry under the project provenance rules."
